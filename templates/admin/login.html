<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion admin</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --ink: #14171b; --accent: #2e6f5e; --accent-hover: #24594b;
      --line: #e6e4de; --ink-body: #1f2126; --ink-muted: #6e7176;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "IBM Plex Sans", sans-serif;
      background: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      color: var(--ink-body);
    }
    .auth-card {
      width: 100%;
      max-width: 380px;
      background: #fff;
      border-radius: 8px;
      padding: 2.25rem 2rem;
    }
    .auth-brand {
      display: flex;
      align-items: center;
      gap: .6rem;
      margin-bottom: 1.75rem;
    }
    .auth-brand .mark {
      width: 30px; height: 30px; border-radius: 6px;
      background: var(--accent); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 600; flex-shrink: 0;
    }
    .auth-brand .name { font-weight: 600; font-size: 1.05rem; }
    h1.auth-title { font-size: 1.05rem; font-weight: 600; margin: 0 0 1.25rem; }
    .form-label { font-size: .85rem; font-weight: 500; color: var(--ink-body); }
    .form-control {
      border-color: var(--line);
      border-radius: 5px;
      padding: .55rem .75rem;
    }
    .form-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(46,111,94,.12);
    }
    .btn-primary {
      background: var(--accent); border-color: var(--accent);
      border-radius: 5px; font-weight: 500; padding: .55rem;
    }
    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .auth-footnote { font-size: .85rem; color: var(--ink-muted); text-align: center; margin-top: 1.25rem; }
    .auth-footnote a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .auth-footnote a:hover { text-decoration: underline; }
    .alert-danger {
      background: #fbeeec; border: 1px solid #edc9c2; color: #8a3a2a;
      border-radius: 5px; font-size: .87rem; padding: .6rem .8rem;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-brand">
      <span class="mark">A</span>
      <span class="name">Admin</span>
    </div>
    <h1 class="auth-title">Connexion</h1>
    {% if error %}
    <div class="alert-danger mb-3">{{ error }}</div>
    {% endif %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="mb-3">
        <label class="form-label">{{ username_field }}</label>
        <input type="text" class="form-control" name="{{ username_field }}" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Mot de passe</label>
        <input type="password" class="form-control" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Se connecter</button>
    </form>
    {% if signup_enabled %}
    <p class="auth-footnote">Pas de compte ? <a href="{{ url_for('auth.signup_page') }}">S'inscrire</a></p>
    {% endif %}
  </div>
</body>
</html>
